<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>txqr 離線全功能傳輸工具 (圖片/文字/檔案)</title>
  <!-- 引入開源庫: QR Code 產生器 & jsQR 影像解碼器 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #111827;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .app-card {
      background: #1f2937;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }
    .nav-tabs {
      display: flex;
      background: #111827;
      border-bottom: 1px solid #374151;
    }
    .tab-btn {
      flex: 1;
      padding: 14px;
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #3b82f6;
      border-bottom: 3px solid #3b82f6;
      background: #1f2937;
    }
    .tab-content {
      padding: 20px;
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    select, input[type="file"], input[type="number"], textarea {
      width: 100%;
      padding: 8px 12px;
      background: #374151;
      border: 1px solid #4b5563;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
    }
    textarea { height: 80px; resize: vertical; }
    .qr-box {
      width: 260px;
      height: 260px;
      margin: 14px auto;
      border: 2px dashed #3b82f6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      overflow: hidden;
    }
    .qr-box img { width: 100%; height: 100%; object-fit: contain; }
    #video-container {
      position: relative;
      width: 100%;
      height: 240px;
      border: 2px solid #10b981;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .progress-bg {
      width: 100%;
      height: 10px;
      background: #374151;
      border-radius: 5px;
      margin-top: 14px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #10b981;
      transition: width 0.1s;
    }
    .status-text {
      font-family: monospace;
      font-size: 0.85rem;
      color: #60a5fa;
      margin-top: 8px;
      text-align: center;
    }
    .btn {
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:disabled { background: #4b5563; cursor: not-allowed; }
    .btn-success { background: #10b981; }
    #result-box {
      margin-top: 16px;
      display: none;
      text-align: center;
      background: #111827;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #10b981;
    }
    #result-box img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 6px;
      margin-top: 8px;
    }
    .download-link {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 16px;
      background: #10b981;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="app-card">
  <!-- 頁籤按鈕 -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('sender')">📤 發送端</button>
    <button class="tab-btn" onclick="switchTab('receiver')">📥 接收端</button>
  </div>

  <!-- 頁面 1: 發送端 -->
  <div id="sender" class="tab-content active">
    <div class="form-group">
      <label>1. 選擇傳輸類型</label>
      <select id="dataType" onchange="toggleInputType()">
        <option value="file">檔案 / 圖片 (Any File)</option>
        <option value="text">純文字 / JSON (Text)</option>
      </select>
    </div>

    <!-- 檔案輸入框 -->
    <div class="form-group" id="fileGroup">
      <label>選擇檔案</label>
      <input type="file" id="fileInput">
    </div>

    <!-- 文字輸入框 -->
    <div class="form-group" id="textGroup" style="display: none;">
      <label>輸入純文字數據</label>
      <textarea id="textInput" placeholder="在此貼上文字、JSON、程式碼..."></textarea>
    </div>

    <div style="display: flex; gap: 10px;">
      <div class="form-group" style="flex:1;">
        <label>單包 Bytes</label>
        <input type="number" id="chunkSize" value="350">
      </div>
      <div class="form-group" style="flex:1;">
        <label>張/毫秒</label>
        <input type="number" id="frameInterval" value="200">
      </div>
    </div>

    <button class="btn" id="startTxBtn" onclick="startBroadcasting()">開始播放動態 QR Code</button>

    <div class="qr-box" id="qrContainer">
      <span style="color: #6b7280; font-size: 0.85rem;">等待資料載入...</span>
    </div>

    <div class="status-text" id="txStatus">狀態：未開始</div>
  </div>

  <!-- 頁面 2: 接收端 -->
  <div id="receiver" class="tab-content">
    <div id="video-container">
      <video id="video" playsinline></video>
    </div>

    <div class="progress-bg">
      <div id="rxProgress" class="progress-fill"></div>
    </div>

    <div class="status-text" id="rxStatus">狀態：點擊下方按鈕啟動鏡頭</div>

    <button class="btn btn-success" id="startCamBtn" onclick="startScanner()">開啟鏡頭掃描 (省電模式)</button>

    <div id="result-box">
      <h3 style="color: #10b981; font-size: 0.95rem;">數據還原成功！</h3>
      
      <!-- 文字結果 -->
      <textarea id="resultText" readonly style="display:none; margin-top:8px;"></textarea>
      
      <!-- 圖片結果 -->
      <img id="restoredImg" src="" alt="還原結果" style="display:none;">
      
      <!-- 下載連結 (通用檔案) -->
      <a id="downloadBtn" class="download-link" style="display:none;" download>下載接收到的檔案</a>
    </div>
  </div>
</div>

<canvas id="hiddenCanvas" hidden></canvas>

<script>
  /* ================= 頁籤切換與介面控制 ================= */
  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if (tabId === 'sender') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('sender').classList.add('active');
      stopScanner();
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('receiver').classList.add('active');
      stopBroadcasting();
    }
  }

  function toggleInputType() {
    const type = document.getElementById('dataType').value;
    document.getElementById('fileGroup').style.display = (type === 'file') ? 'block' : 'none';
    document.getElementById('textGroup').style.display = (type === 'text') ? 'block' : 'none';
  }

  /* ================= 發送端邏輯 ================= */
  let chunks = [];
  let currentFrame = 0;
  let txTimer = null;

  function startBroadcasting() {
    const type = document.getElementById('dataType').value;
    const chunkSize = parseInt(document.getElementById('chunkSize').value) || 350;
    const interval = parseInt(document.getElementById('frameInterval').value) || 200;

    if (type === 'text') {
      const text = document.getElementById('textInput').value.trim();
      if (!text) return alert("請輸入文字數據！");
      // 純文字帶有 TXT: 前綴
      prepareChunks("TXT:" + text, chunkSize, interval);
    } else {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return alert("請選擇檔案！");

      const reader = new FileReader();
      reader.onload = function(e) {
        // 檔案帶有 FILE:檔名|DataURL 前綴
        const filePayload = `FILE:${file.name}|${e.target.result}`;
        prepareChunks(filePayload, chunkSize, interval);
      };
      reader.readAsDataURL(file);
    }
  }

  function prepareChunks(payload, chunkSize, interval) {
    chunks = splitDataIntoChunks(payload, chunkSize);
    stopBroadcasting();
    currentFrame = 0;

    txTimer = setInterval(() => {
      renderFrame(currentFrame);
      currentFrame = (currentFrame + 1) % chunks.length;
    }, interval);
  }

  function stopBroadcasting() {
    if (txTimer) clearInterval(txTimer);
  }

  function splitDataIntoChunks(dataStr, size) {
    const result = [];
    const total = Math.ceil(dataStr.length / size);
    for (let i = 0; i < total; i++) {
      const segment = dataStr.slice(i * size, (i + 1) * size);
      result.push(`${i + 1}/${total}|${segment}`);
    }
    return result;
  }

  function renderFrame(index) {
    const payload = chunks[index];
    document.getElementById('txStatus').innerText = `播放中：${index + 1} / ${chunks.length} 包`;
    try {
      const qr = qrcode(0, 'L');
      qr.addData(payload);
      qr.make();
      document.getElementById('qrContainer').innerHTML = qr.createImgTag(5, 0);
    } catch (err) {
      document.getElementById('txStatus').innerText = "切片過大，無法繪製！請降低 Chunk Size。";
      stopBroadcasting();
    }
  }

  /* ================= 接收端邏輯 (低耗電優化) ================= */
  const video = document.getElementById('video');
  const hiddenCanvas = document.getElementById('hiddenCanvas');
  const ctx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
  const rxStatus = document.getElementById('rxStatus');
  const rxProgress = document.getElementById('rxProgress');
  const resultBox = document.getElementById('result-box');

  let receivedChunks = new Map();
  let totalChunks = 0;
  let isScanning = false;
  let scanTimer = null;

  async function startScanner() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { 
          facingMode: "environment",
          width: { ideal: 640 },
          height: { ideal: 480 }
        }
      });
      video.srcObject = stream;
      video.setAttribute("playsinline", true);
      video.play();
      
      document.getElementById('startCamBtn').style.display = 'none';
      rxStatus.innerText = "狀態：省電掃描中...";
      isScanning = true;
      receivedChunks.clear();
      resultBox.style.display = 'none';
      
      if (scanTimer) clearInterval(scanTimer);
      scanTimer = setInterval(processFrame, 80);
    } catch (err) {
      rxStatus.innerText = "失敗：開啟鏡頭需 HTTPS 環境或 localhost";
    }
  }

  function stopScanner() {
    isScanning = false;
    if (scanTimer) clearInterval(scanTimer);
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
      video.srcObject = null;
    }
    document.getElementById('startCamBtn').style.display = 'block';
  }

  function processFrame() {
    if (!isScanning) return;

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      hiddenCanvas.height = video.videoHeight;
      hiddenCanvas.width = video.videoWidth;
      ctx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
      
      const imageData = ctx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: "dontInvert",
      });

      if (code && code.data) {
        parseTxqrHeader(code.data);
      }
    }
  }

  function parseTxqrHeader(payload) {
    const pipeIndex = payload.indexOf('|');
    if (pipeIndex === -1) return;

    const header = payload.substring(0, pipeIndex);
    const data = payload.substring(pipeIndex + 1);
    const parts = header.split('/');

    if (parts.length !== 2) return;
    const currentIdx = parseInt(parts[0], 10);
    const total = parseInt(parts[1], 10);

    if (isNaN(currentIdx) || isNaN(total)) return;

    totalChunks = total;

    if (!receivedChunks.has(currentIdx)) {
      receivedChunks.set(currentIdx, data);
      const percent = Math.floor((receivedChunks.size / totalChunks) * 100);
      rxProgress.style.width = percent + '%';
      rxStatus.innerText = `接收進度：${receivedChunks.size} / ${totalChunks} 包 (${percent}%)`;

      if (receivedChunks.size === totalChunks) {
        completeAssembly();
      }
    }
  }

  function completeAssembly() {
    stopScanner();
    rxStatus.innerText = "組裝完成！";

    let fullPayload = '';
    for (let i = 1; i <= totalChunks; i++) {
      fullPayload += receivedChunks.get(i);
    }

    // 隱藏所有結果區域
    document.getElementById('resultText').style.display = 'none';
    document.getElementById('restoredImg').style.display = 'none';
    document.getElementById('downloadBtn').style.display = 'none';

    // 解析資料類型
    if (fullPayload.startsWith("TXT:")) {
      const textContent = fullPayload.replace("TXT:", "");
      const resultText = document.getElementById('resultText');
      resultText.value = textContent;
      resultText.style.display = 'block';
    } else if (fullPayload.startsWith("FILE:")) {
      const metaAndData = fullPayload.replace("FILE:", "");
      const pipeIdx = metaAndData.indexOf('|');
      const fileName = metaAndData.substring(0, pipeIdx);
      const dataUrl = metaAndData.substring(pipeIdx + 1);

      if (dataUrl.startsWith("data:image/")) {
        const restoredImg = document.getElementById('restoredImg');
        restoredImg.src = dataUrl;
        restoredImg.style.display = 'block';
      }
      
      const downloadBtn = document.getElementById('downloadBtn');
      downloadBtn.href = dataUrl;
      downloadBtn.download = fileName;
      downloadBtn.innerText = `下載檔案 (${fileName})`;
      downloadBtn.style.display = 'inline-block';
    }

    resultBox.style.display = 'block';
  }
</script>

</body>
</html>
